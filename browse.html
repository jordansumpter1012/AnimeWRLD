<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Author: Jordan Sumpter -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeWRLD - Browse</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2 class="logo">AnimeWRLD</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="browse.html" class="active">Browse</a>
            <a href="#reviews">Reviews</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main class="browse-content">

        <h1>Browse Anime</h1>

        <input type="search"
               class="search-bar"
               placeholder="Search for anime..."
               aria-label="Search for anime">

        <h2>Popular Anime</h2>

        <section class="anime-grid">

            <div class="anime-card">
                <img src="images/deoms.jpg"
                     alt="Demon Slayer">
                <p>Demon Slayer</p>
            </div>

            <div class="anime-card">
                <img src="images/one pie.jpg"
                     alt="One Piece">
                <p>One Piece</p>
            </div>

            <div class="anime-card">
                <img src="images/rasangan.jpg"
                     alt="Naruto">
                <p>Naruto</p>
            </div>

            <div class="anime-card">
                <img src="images/aot.jpg"
                     alt="Attack on Titan">
                <p>Attack on Titan</p>
            </div>

        </section>

    </main>

</body>
</html>
